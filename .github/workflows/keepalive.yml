name: Ping UniMatch Render
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unimatch-health
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Render health
        run: |
          if ! python3 Run/ping_render.py --once; then
            sleep 10
            python3 Run/ping_render.py --once
          fi
